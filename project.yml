name: YGORip
options:
  bundleIdPrefix: com.lavailabs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: "84FW6HJMUP"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"

  # Drag-to-tear pack opening, shared with poke-rip.
  #
  # SSH, not HTTPS: the repo is private, and SwiftPM over HTTPS prompts for a GitHub username, which
  # fails outright in a non-interactive build. Any machine or CI runner building this needs an SSH
  # key on the account.
  #
  # Pinned exactly — a floating dependency means the pack-opening animation can change under a build
  # nobody touched. Its own tests do NOT run with `xcodebuild test` here; a package test target is
  # invisible to an app scheme. Run them at the source: `cd ../pack-tear && swift test`.
  PackTear:
    url: git@github.com:bscarlavai/pack-tear.git
    exactVersion: 1.1.1

targets:
  YGORip:
    type: application
    platform: iOS
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: PackTear
        product: PackTear
    sources:
      - path: YGORip
        excludes:
          - "**/.DS_Store"
    resources:
      - path: YGORip/Resources/Assets.xcassets
      - path: YGORip/Resources/YGORip.storekit
      - path: YGORip/Resources/Audio
      - path: YGORip/PrivacyInfo.xcprivacy
      # Folder reference: Xcode bundles the whole tree at build time without
      # enumerating individual files at project-generation time. Important
      # because the logo-scrape pipeline adds files to set-logos/ on its
      # own schedule — group references would force an xcodegen re-run after
      # each new set's logo lands.
      - path: YGORip/Resources/Bundled
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lavailabs.ygorip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: YGORip/Info.plist
      properties:
        CFBundleDisplayName: YuRip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: YGORip/YGORip.entitlements
    scheme:
      storeKitConfiguration: YGORip/Resources/YGORip.storekit
      testTargets:
        - YGORipTests
        # Real-touch coverage of the pack rip (both styles) plus screenshot captures of the
        # screens this suite reaches. Needs free packs on the simulator: out of packs, the pack
        # tests SKIP and xcodebuild still prints TEST SUCCEEDED, so read the skip messages.
        - YGORipUITests

  YGORipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YGORipTests
    dependencies:
      - target: YGORip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  YGORipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YGORipUITests
    dependencies:
      - target: YGORip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lavailabs.ygorip.uitests
        TEST_TARGET_NAME: YGORip
